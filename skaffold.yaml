# Everything on a local kind cluster: stock Multica (official Helm chart, GHCR
# images), our daemon (bb backend), bb as a two-node celld fleet with MinIO and
# Postgres, the sandbox gateway, and agent-sandbox (controller + a warm pool of
# sandboxes the agent works in).
#
#   kind create cluster --name bb --config deploy/kind/cluster.yaml
#   skaffold dev            # build, deploy, stream logs, port-forward
#   open http://localhost:3000   (sign in as bb-admin@example.com, code 888888)
#
# Behind a TLS-intercepting proxy, build the images yourself with the CA secret
# (see bb/Dockerfile, Dockerfile.daemon) and run `skaffold dev --build-artifacts=...`.
apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: multica-bb

build:
  local:
    push: false              # kind: skaffold loads images into the cluster
    useBuildkit: true
  artifacts:
    - image: multica-daemon-bb
      context: .
      docker:
        dockerfile: Dockerfile.daemon
        buildArgs:
          VERSION: v0.10.0-bb
    - image: bb
      context: bb
      docker:
        dockerfile: Dockerfile
    - image: bb-gateway
      context: bb
      docker:
        dockerfile: Dockerfile
        target: gateway
    - image: bb-sandbox
      context: deploy/sandbox
      docker:
        dockerfile: Dockerfile

manifests:
  rawYaml:
    - deploy/k8s/secrets.dev.yaml
    - deploy/k8s/minio.yaml
    - deploy/k8s/bb-postgres.yaml
    - deploy/k8s/bb.yaml
    - deploy/k8s/bb-gateway.yaml
    - deploy/k8s/sandbox.yaml
    - deploy/k8s/daemon.yaml

# skaffold sets image tags only in known kinds unless told: the sandbox image is
# inside agent-sandbox's SandboxTemplate.
resourceSelector:
  allow:
    - groupKind: SandboxTemplate.extensions.agents.x-k8s.io
      image: [".*"]

deploy:
  kubectl:
    hooks:
      before:
        # agent-sandbox (pinned, vendored) first: its CRDs must exist before
        # deploy/k8s/sandbox.yaml applies.
        - host:
            command:
              - sh
              - -c
              - >-
                kubectl --context "${SKAFFOLD_KUBE_CONTEXT:-kind-bb}" apply --server-side -f deploy/k8s/vendor/agent-sandbox-v1.0.9.yaml &&
                kubectl --context "${SKAFFOLD_KUBE_CONTEXT:-kind-bb}" wait --for condition=established --timeout=120s
                crd/sandboxes.agents.x-k8s.io crd/sandboxclaims.extensions.agents.x-k8s.io
                crd/sandboxtemplates.extensions.agents.x-k8s.io crd/sandboxwarmpools.extensions.agents.x-k8s.io
  helm:
    releases:
      - name: multica
        chartPath: upstream/deploy/helm/multica   # the official chart, pinned with the submodule
        valuesFiles:
          - deploy/values.yaml
          - deploy/values-dev.yaml
        wait: false

portForward:
  - resourceType: service
    resourceName: multica-frontend
    port: 3000
    localPort: 3000
  - resourceType: service
    resourceName: multica-backend
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: bb
    port: 8080
    localPort: 8787          # same port as mock-bb, so compose/drills/lib.sh works unchanged
