name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      drills:
        description: Run the compose failure drills
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # check-pins needs the submodule's tags
      - name: Fetch upstream tags
        run: git -C upstream fetch --tags --quiet
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/server/go.mod
          cache-dependency-path: upstream/server/go.sum
      - name: Pins agree (submodule == compose image tag)
        run: scripts/check-pins.sh
      - name: Patch applies cleanly to the pinned tag
        run: scripts/apply-overlay.sh
      - name: gofmt
        run: test -z "$(gofmt -l bb-backend mock-bb)" || { gofmt -l bb-backend mock-bb; exit 1; }
      - name: Unit tests (bb backend, daemon, mock-bb)
        run: make test
      - name: Contract test (real backend vs mock-bb)
        run: make test-contract
      - name: Shell scripts
        run: |
          shellcheck -S warning scripts/*.sh hooks/*.sh compose/*.sh compose/drills/*.sh docker/*.sh bb/docker/*.sh

  bb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: bb, POSTGRES_PASSWORD: bb, POSTGRES_DB: bb }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bb" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: bb
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/server/go.mod
          cache-dependency-path: upstream/server/go.sum
      - run: bun install --frozen-lockfile
      - name: verify (typecheck, lint, knip, tests)
        run: bun run verify
      - name: Postgres mailbox contract
        run: bun run test:postgres
        env: { DATABASE_URL: "postgres://bb:bb@127.0.0.1:5432/bb" }
      - name: Go daemon contract test against bb on celld
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/denoland/celld/releases/download/v0.6.2/celld-x86_64-unknown-linux-gnu.gz | gzip -dc > "$HOME/.local/bin/celld"
          chmod +x "$HOME/.local/bin/celld"
          PATH="$PWD/node_modules/.bin:$HOME/.local/bin:$PATH" CELLD_V8_HEAP_LIMIT_MB=1024 celld dev . --port 18787 --no-watch > celld.log 2>&1 &
          for _ in $(seq 60); do curl -sf localhost:18787/health && break; sleep 1; done
          ../scripts/apply-overlay.sh
          cd ../upstream/server && BB_CONTRACT_URL=http://127.0.0.1:18787 BB_CONTRACT_TOKEN=local-bb-token \
            go test ./pkg/agent -run BBContract -count=1 -v
      - name: celld log on failure
        if: failure()
        run: tail -200 celld.log

  image:
    needs: [test, bb]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Upstream tag
        id: up
        run: |
          git -C upstream fetch --tags --quiet
          echo "tag=$(git -C upstream describe --tags --exact-match HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-daemon-bb
          tags: |
            type=raw,value=${{ steps.up.outputs.tag }}-bb-{{sha}}
            type=raw,value=${{ steps.up.outputs.tag }}-bb,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - id: bbmeta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bb
          tags: |
            type=raw,value=bb-{{sha}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: bb image
        uses: docker/build-push-action@v6
        with:
          context: bb
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.bbmeta.outputs.tags }}
          cache-from: type=gha,scope=bb
          cache-to: type=gha,mode=max,scope=bb
      - name: bb gateway image
        uses: docker/build-push-action@v6
        with:
          context: bb
          target: gateway
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/bb-gateway:bb-${{ github.sha }}
          cache-from: type=gha,scope=bb-gateway
          cache-to: type=gha,mode=max,scope=bb-gateway
      - name: sandbox image (sandboxd + tools)
        uses: docker/build-push-action@v6
        with:
          context: deploy/sandbox
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/bb-sandbox:bb-${{ github.sha }}
          cache-from: type=gha,scope=bb-sandbox
          cache-to: type=gha,mode=max,scope=bb-sandbox
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.daemon
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.up.outputs.tag }}-bb
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  drills:
    # Full stack: stock Multica images (GHCR) + our daemon + bb, then every failure
    # drill with invariant checks: once against mock-bb, once against the real bb
    # celld fleet (MinIO + Postgres), which adds the node-crash drill.
    needs: [test, bb]
    if: github.event_name != 'workflow_dispatch' || inputs.drills
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [mock, bb]
    env:
      COMPOSE_FILE: ${{ matrix.backend == 'bb' && 'docker-compose.yml:docker-compose.bb.yml' || 'docker-compose.yml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Start stack
        run: compose/up.sh
      - name: Failure drills
        run: compose/drills/run-all.sh
      - name: Logs on failure
        if: failure()
        working-directory: compose
        run: |
          docker compose logs --no-color --tail 300
          curl -s http://127.0.0.1:8787/admin/state | jq .
      - name: Tear down
        if: always()
        working-directory: compose
        run: docker compose down -v
