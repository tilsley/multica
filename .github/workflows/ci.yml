name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      drills:
        description: Run the compose failure drills
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # check-pins needs the submodule's tags
      - name: Fetch upstream tags
        run: git -C upstream fetch --tags --quiet
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/server/go.mod
          cache-dependency-path: upstream/server/go.sum
      - name: Pins agree (submodule == compose image tag)
        run: scripts/check-pins.sh
      - name: Patch applies cleanly to the pinned tag
        run: scripts/apply-overlay.sh
      - name: gofmt
        run: test -z "$(gofmt -l bb-backend mock-bb)" || { gofmt -l bb-backend mock-bb; exit 1; }
      - name: Unit tests (bb backend, daemon, mock-bb)
        run: make test
      - name: Contract test (real backend vs mock-bb)
        run: make test-contract
      - name: Shell scripts
        run: |
          shellcheck -S warning scripts/*.sh hooks/*.sh compose/*.sh compose/drills/*.sh docker/*.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Upstream tag
        id: up
        run: |
          git -C upstream fetch --tags --quiet
          echo "tag=$(git -C upstream describe --tags --exact-match HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-daemon-bb
          tags: |
            type=raw,value=${{ steps.up.outputs.tag }}-bb-{{sha}}
            type=raw,value=${{ steps.up.outputs.tag }}-bb,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.daemon
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.up.outputs.tag }}-bb
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  drills:
    # Full stack: stock Multica images (GHCR) + our daemon + mock-bb, then every
    # failure drill with invariant checks. ~10 minutes.
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.drills
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Start stack
        run: compose/up.sh
      - name: Failure drills
        run: compose/drills/run-all.sh
      - name: Logs on failure
        if: failure()
        working-directory: compose
        run: |
          docker compose logs --no-color --tail 300 daemon backend mock-bb
          curl -s http://127.0.0.1:8787/admin/state | jq .
      - name: Tear down
        if: always()
        working-directory: compose
        run: docker compose down -v
