# DEV / TEST CLUSTER ONLY. Real deployments create these out of band (deploy/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: multica-secrets   # read by the official chart (existingSecret)
type: Opaque
stringData:
  JWT_SECRET: dev-only-jwt-secret-change-me-dev-only-jwt-secret
  POSTGRES_PASSWORD: multica-dev
  RESEND_API_KEY: ""
  GOOGLE_CLIENT_SECRET: ""
  CLOUDFRONT_PRIVATE_KEY: ""
  # Lets the daemon's dev bootstrap sign in without email. Ignored when APP_ENV=production.
  MULTICA_DEV_VERIFICATION_CODE: "888888"
---
apiVersion: v1
kind: Secret
metadata:
  name: bb-secrets
type: Opaque
stringData:
  BB_TOKEN: local-bb-token
  AWS_ACCESS_KEY_ID: bb-minio
  AWS_SECRET_ACCESS_KEY: bb-minio-secret
  POSTGRES_PASSWORD: bb
  DATABASE_URL: postgres://bb:bb@bb-postgres:5432/bb
  # Shared by the bb Worker and the sandbox gateway.
  BB_GATEWAY_TOKEN: local-gateway-token
