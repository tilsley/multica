# The celld fleet bucket for local clusters. MinIO >= RELEASE.2025-09-07 (celld#162);
# fine for kind, not qualified for production (use S3, R2 or GCS there).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels: { app.kubernetes.io/name: minio }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: minio }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minio }
    spec:
      containers:
        - name: minio
          image: chainguard/minio:latest
          args: ["server", "/data", "--address", ":9000"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: bb-secrets, key: AWS_ACCESS_KEY_ID } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: bb-secrets, key: AWS_SECRET_ACCESS_KEY } }
          ports: [{ containerPort: 9000, name: s3 }]
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
          volumeMounts: [{ name: data, mountPath: /data }]
        # Creates the fleet bucket, then idles: a sidecar rather than a Job, so
        # repeated `skaffold dev` deploys stay idempotent.
        - name: create-bucket
          image: chainguard/minio:latest
          command: ["/bin/sh", "-c"]
          args:
            - until mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done;
              mc mb -p local/bb-fleet && exec sleep infinity
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: bb-secrets, key: AWS_ACCESS_KEY_ID } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: bb-secrets, key: AWS_SECRET_ACCESS_KEY } }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app.kubernetes.io/name: minio }
  ports: [{ name: s3, port: 9000, targetPort: 9000 }]
